[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music2midi"
version = "0.1.0"
description = "Transcribe audio to multi-instrument MIDI, render Synthesia-style piano videos, and generate new songs with Claude"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pretty_midi>=0.2.10",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
transcribe = [
    "demucs>=4.0.1",
    "basic-pitch>=0.4",
    "onnxruntime>=1.17",
    "librosa>=0.10",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
music2midi = "music2midi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that need heavy deps, network, or long runtimes"]
